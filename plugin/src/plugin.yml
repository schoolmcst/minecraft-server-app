name: XrayWatch
version: "1.2"
main: xraywatch.XrayWatch
api-version: "1.13"
description: X-ray detection, game client reports and graves for the Minecraft Server app.
commands:
  xraywatch:
    description: Shows who might be using X-ray, or one player's mining numbers.
    usage: /xraywatch [player | reset <player>]
    aliases: [xw]
